<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Som da Terra</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.3);
            --text-main: #f0f0f0;
            --text-muted: #8b92a5;
            --danger: #ff4757;
            --success: #2ed573;
            --tab-bg: #222630;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(26, 29, 36, 1) 0%, rgba(15, 17, 21, 1) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Power Button */
        .power-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #2f3640;
            color: var(--text-main);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .power-btn.active {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.4);
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--danger);
            transition: background-color 0.3s ease;
        }

        .power-btn.active .indicator {
            background-color: #000;
        }

        /* Tabs System */
        .tabs-nav {
            display: flex;
            background-color: var(--tab-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Cards and Controls */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            margin: 0;
        }

        .value-display {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent);
            background: rgba(0, 229, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #2f3640;
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Vertical Sliders Styling */
        .sliders-pair-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 10px 0;
        }

        .vertical-control-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .control-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Drum Wheel Style */
        .wheel-control {
            width: 80px;
            height: 200px;
            background: #15181e;
            border: 3px solid #3a3f4d;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            box-shadow:
                inset 0 15px 15px rgba(0, 0, 0, 0.8),
                inset 0 -15px 15px rgba(0, 0, 0, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .wheel-control:active {
            cursor: grabbing;
        }

        .wheel-ribs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.05) 0px,
                    rgba(255, 255, 255, 0.05) 1px,
                    transparent 2px,
                    transparent 15px,
                    rgba(0, 0, 0, 0.4) 16px,
                    rgba(0, 0, 0, 0.6) 18px,
                    transparent 19px,
                    transparent 30px);
            background-position-y: 0px;
        }

        .wheel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(to bottom,
                    rgba(15, 17, 21, 0.95) 0%,
                    rgba(15, 17, 21, 0.4) 15%,
                    transparent 40%,
                    transparent 60%,
                    rgba(15, 17, 21, 0.4) 85%,
                    rgba(15, 17, 21, 0.95) 100%);
        }

        .wheel-center-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            opacity: 0.7;
            pointer-events: none;
        }

        .gain-slider-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type=range][orient=vertical] {
            -webkit-appearance: slider-vertical;
            writing-mode: vertical-lr;
            direction: rtl;
            width: 10px;
            height: 200px;
            background: #2f3640;
            border-radius: 4px;
            outline: none;
        }

        input[type=range][orient=vertical]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        input[type=range][orient=vertical]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Registry Panel Table */
        .btn-action {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #2f3640;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .btn-action:hover {
            background-color: #3e4450;
        }

        .btn-action.primary {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
        }

        .btn-action.primary:hover {
            background-color: #00b8d4;
        }

        .btn-action.danger {
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.2);
        }

        .btn-action.danger:hover {
            background-color: rgba(255, 71, 87, 0.2);
        }

        .table-container {
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            background: #15181e;
            margin: 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th {
            background-color: #1a1d24;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }

        tr:nth-child(even) td {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .btn-delete:hover {
            background-color: rgba(255, 71, 87, 0.1);
        }

        .records-footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .records-footer .btn-action {
            flex: 1;
        }

        /* Toggle Switch styling */
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2f3640;
            transition: .3s;
            border-radius: 34px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-main);
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider-toggle {
            background-color: var(--accent);
        }

        input:checked+.slider-toggle:before {
            transform: translateX(24px);
            background-color: #000;
        }

        .instructions {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <header>
        <h1>Som da Terra</h1>
    </header>

    <div class="container">

        <!-- Power Button -->
        <button id="powerBtn" class="power-btn">
            <div class="indicator"></div>
            <span id="powerText">Desligado</span>
        </button>

        <!-- Navigation Tabs -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-target="tab-controls">Controles</button>
            <button class="tab-btn" data-target="tab-params">Parâmetros</button>
        </div>

        <!-- ABA 1: CONTROLES -->
        <div id="tab-controls" class="tab-content active">

            <!-- Pair of Vertical Controls (Wheel and Gain) -->
            <div class="card">
                <div class="sliders-pair-container">

                    <!-- Left: Defasagem (Infinite Drum Wheel) -->
                    <div class="vertical-control-wrapper">
                        <span class="control-label">Defasagem</span>
                        <div class="wheel-control" id="defasagemWheel">
                            <div class="wheel-ribs" id="wheelRibs"></div>
                            <div class="wheel-overlay"></div>
                            <div class="wheel-center-line"></div>
                        </div>
                        <span class="value-display" id="defasagemValue">0 ms</span>
                    </div>

                    <!-- Right: Ganho (Standard Vertical Range) -->
                    <div class="vertical-control-wrapper">
                        <span class="control-label">Ganho</span>
                        <div class="gain-slider-container">
                            <input type="range" id="gainSlider" min="0" max="200" step="5" value="100"
                                orient="vertical">
                        </div>
                        <span class="value-display" id="gainValue">100%</span>
                    </div>

                </div>
            </div>

            <!-- Registry Panel -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Valores de Defasagem</h2>
                    <button id="btnRegistrar" class="btn-action primary">Registrar</button>
                </div>

                <div class="table-container">
                    <table id="recordsTable">
                        <thead>
                            <tr>
                                <th>Nº</th>
                                <th>Hora</th>
                                <th>Defasagem</th>
                                <th style="width: 45px;"></th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody">
                            <!-- Dynamically added rows -->
                        </tbody>
                    </table>
                    <div id="noRecordsMsg" class="instructions" style="margin: 15px 0;">Nenhum registro encontrado.
                    </div>
                </div>

                <div class="records-footer">
                    <button id="btnSalvar" class="btn-action">Salvar</button>
                    <button id="btnCopiar" class="btn-action">Copiar</button>
                    <button id="btnLimpar" class="btn-action danger">Limpar</button>
                </div>
            </div>

        </div>

        <!-- ABA 2: PARÂMETROS -->
        <div id="tab-params" class="tab-content">

            <!-- Interval Base (Período) (Moved here, step changed to 0.2s) -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Intervalo Base (Período)</h2>
                    <span class="value-display" id="intervalValue">1.00 s</span>
                </div>
                <input type="range" id="intervalSlider" min="0.2" max="2.0" step="0.2" value="1.0">
            </div>

            <!-- Frequency Control -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Frequência Portadora</h2>
                    <span class="value-display" id="freqValue">4000 Hz</span>
                </div>
                <input type="range" id="freqSlider" min="3000" max="5000" step="200" value="4000">
            </div>

            <!-- Decay Time Control -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Decaimento do Envelope</h2>
                    <span class="value-display" id="decayValue">50 ms</span>
                </div>
                <input type="range" id="decaySlider" min="10" max="100" step="10" value="50">
            </div>

            <!-- Esconder registros Toggle -->
            <div class="card">
                <div class="toggle-container">
                    <span class="control-label" style="color: var(--text-main);">Esconder registros</span>
                    <label class="switch">
                        <input type="checkbox" id="hideRecordsToggle">
                        <span class="slider-toggle"></span>
                    </label>
                </div>
            </div>

        </div>

    </div>

    <script>
        // DOM Elements
        const powerBtn = document.getElementById('powerBtn');
        const powerText = document.getElementById('powerText');

        // Tab Elements
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        // Controles Elements
        const defasagemWheel = document.getElementById('defasagemWheel');
        const wheelRibs = document.getElementById('wheelRibs');
        const defasagemValue = document.getElementById('defasagemValue');
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');

        // Parâmetros Elements
        const intervalSlider = document.getElementById('intervalSlider');
        const intervalValue = document.getElementById('intervalValue');
        const freqSlider = document.getElementById('freqSlider');
        const freqValue = document.getElementById('freqValue');
        const decaySlider = document.getElementById('decaySlider');
        const decayValue = document.getElementById('decayValue');
        const hideRecordsToggle = document.getElementById('hideRecordsToggle');

        // Table Elements
        const btnRegistrar = document.getElementById('btnRegistrar');
        const recordsBody = document.getElementById('recordsBody');
        const noRecordsMsg = document.getElementById('noRecordsMsg');
        const btnSalvar = document.getElementById('btnSalvar');
        const btnCopiar = document.getElementById('btnCopiar');
        const btnLimpar = document.getElementById('btnLimpar');

        // State Variables
        let isPlaying = false;
        let audioCtx;
        let epochOffset = 0; // Relação estável entre o relógio de sistema e o de áudio

        // Audio Engine Timing Variables (Epoch Synchronization Engine)
        const lookahead = 25.0; // ms
        const scheduleAheadTime = 0.15; // s (Menor margem para resposta ultra-rápida às alterações dos controles)
        let timerID;
        const scheduledIndices = new Set(); // Guarda os índices de batida agendados para evitar duplicidade

        // Master nodes
        let masterGainNode;
        let limiter;

        // Infinite Wheel Logic State
        let defasagemMs = 0; // 0 to Max interval limit in ms
        let isDraggingWheel = false;
        let startWheelY = 0;
        let startDefasagemMs = 0;
        let wheelBackgroundY = 0;

        // Registry Table State
        let records = [];
        let recordCounter = 1;
        let isSaved = true; // Rastreia se as modificações atuais foram copiadas ou salvas
        let hideRecordsActive = false;

        // Wake Lock
        let wakeLock = null;

        // -------------------------
        // UI Interaction Handlers
        // -------------------------

        // Tabs Logic
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // Sliders Text Updates
        intervalSlider.addEventListener('input', (e) => {
            intervalValue.textContent = parseFloat(e.target.value).toFixed(2) + ' s';
            adjustDefasagemToInterval();
        });

        freqSlider.addEventListener('input', (e) => {
            freqValue.textContent = e.target.value + ' Hz';
        });

        decaySlider.addEventListener('input', (e) => {
            decayValue.textContent = e.target.value + ' ms';
        });

        gainSlider.addEventListener('input', (e) => {
            gainValue.textContent = e.target.value + '%';
            if (masterGainNode) {
                let baseGain = parseFloat(e.target.value) / 100;
                masterGainNode.gain.setTargetAtTime(baseGain, audioCtx.currentTime, 0.02);
            }
        });

        // Infinite Scroll Wheel Logic (Vertical drag)
        defasagemWheel.addEventListener('pointerdown', (e) => {
            isDraggingWheel = true;
            startWheelY = e.clientY;
            startDefasagemMs = defasagemMs;
            defasagemWheel.setPointerCapture(e.pointerId);
        });

        defasagemWheel.addEventListener('pointermove', (e) => {
            if (!isDraggingWheel) return;

            const deltaY = startWheelY - e.clientY;

            // 1 pixel de arraste vertical = ajuste de 1 milissegundo de precisão
            let targetVal = Math.round(startDefasagemMs + deltaY);

            // Resgata o teto dinâmico de intervalo em milissegundos
            const baseIntervalSec = parseFloat(intervalSlider.value);
            const maxMs = Math.round(baseIntervalSec * 1000);

            // Comportamento Cíclico e Infinito
            if (maxMs > 0) {
                targetVal = targetVal % maxMs;
                if (targetVal < 0) {
                    targetVal += maxMs;
                }
            } else {
                targetVal = 0;
            }

            defasagemMs = targetVal;

            // Rotação visual através do movimento de background das estrias do tambor
            wheelBackgroundY = (startDefasagemMs + deltaY) * 0.4;
            wheelRibs.style.backgroundPositionY = `${wheelBackgroundY}px`;

            updateDefasagemDisplay();
        });

        defasagemWheel.addEventListener('pointerup', (e) => {
            if (isDraggingWheel) {
                defasagemWheel.releasePointerCapture(e.pointerId);
                isDraggingWheel = false;
            }
        });

        // Trata limite de defasagem quando o Intervalo Base é alterado
        function adjustDefasagemToInterval() {
            const baseIntervalSec = parseFloat(intervalSlider.value);
            const maxMs = Math.round(baseIntervalSec * 1000);
            if (maxMs > 0) {
                defasagemMs = defasagemMs % maxMs;
                if (defasagemMs < 0) {
                    defasagemMs += maxMs;
                }
            } else {
                defasagemMs = 0;
            }
            updateDefasagemDisplay();
        }

        function updateDefasagemDisplay() {
            if (hideRecordsActive) {
                defasagemValue.textContent = '*** ms';
            } else {
                defasagemValue.textContent = defasagemMs + ' ms';
            }
        }

        // Toggle Esconder Registros
        hideRecordsToggle.addEventListener('change', (e) => {
            hideRecordsActive = e.target.checked;
            updateDefasagemDisplay();
            renderTable();
        });

        // -------------------------
        // Audio Engine & Sync Logic
        // -------------------------

        function scheduleTone(time, frequency) {
            if (!audioCtx) return;

            const decaySec = parseFloat(decaySlider.value) / 1000.0;
            const envelopeGain = audioCtx.createGain();
            envelopeGain.connect(masterGainNode);

            // Garante silêncio absoluto 10ms antes do pulso acontecer
            envelopeGain.gain.setValueAtTime(0.0001, time - 0.010);

            // Dispara o envelope de volume no momento exato (time)
            envelopeGain.gain.setValueAtTime(0.0001, time);
            envelopeGain.gain.exponentialRampToValueAtTime(1.0, time + 0.001);
            envelopeGain.gain.exponentialRampToValueAtTime(0.0001, time + decaySec);

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, time - 0.010);

            osc.connect(envelopeGain);

            // Liga o oscilador 10ms ANTES em silêncio para neutralizar o bug de bloco do navegador
            osc.start(time - 0.010);
            osc.stop(time + decaySec + 0.02);
        }
        /**
         * O motor de agendamento (scheduler) alinha matematicamente as batidas em relação à Época UNIX (Epoch).
         * Dois dispositivos executando este código em qualquer lugar do mundo estarão sintonizados no mesmo grid absoluto temporal
         * de seus relógios de sistema (que são calibrados por rede celular LTE / NTP).
         * Toda defasagem de processamento de interface, cliques ou abas fica isolada desse grid central e o timing real é mantido.
         */
        function scheduler() {
            if (!isPlaying) return;

            const period = parseFloat(intervalSlider.value); // s
            const totalShift = defasagemMs / 1000.0; // s

            const nowAudio = audioCtx.currentTime;

            // Margem mínima de segurança (100ms). Garante que nenhuma batida seja agendada
            // "em cima da hora", eliminando qualquer descontinuidade ou ruído de truncamento.
            const safetyBuffer = 0.100; // 100 ms

            // Calcula o primeiro índice k garantindo que ele caia pelo menos 100ms no futuro
            const minSystemTime = nowAudio + safetyBuffer + epochOffset - totalShift;
            let k = Math.ceil(minSystemTime / period);

            while (true) {
                const pulseTimeSystem = k * period;
                const pulseTimeAudio = pulseTimeSystem - epochOffset + totalShift;

                // Horizonte de agendamento de 500ms (idêntico à folga segura do código original)
                if (pulseTimeAudio > nowAudio + 0.5) {
                    break;
                }

                if (!scheduledIndices.has(k)) {
                    scheduleTone(pulseTimeAudio, parseFloat(freqSlider.value));
                    scheduledIndices.add(k);
                }
                k++;
            }

            // Limpeza de memória das batidas passadas
            const nowSystem = nowAudio + epochOffset;
            const minK = Math.floor((nowSystem - 5) / period);
            for (const key of scheduledIndices) {
                if (key < minK) {
                    scheduledIndices.delete(key);
                }
            }

            timerID = setTimeout(scheduler, lookahead);
        }

        // -------------------------
        // Registry Panel Actions
        // -------------------------

        function renderTable() {
            recordsBody.innerHTML = '';

            if (records.length === 0) {
                noRecordsMsg.style.display = 'block';
            } else {
                noRecordsMsg.style.display = 'none';
                records.forEach(rec => {
                    const tr = document.createElement('tr');

                    const tdNum = document.createElement('td');
                    tdNum.textContent = rec.id;

                    const tdTime = document.createElement('td');
                    tdTime.textContent = rec.time;

                    const tdDef = document.createElement('td');
                    tdDef.textContent = hideRecordsActive ? '***' : rec.defasagem + ' ms';

                    const tdAction = document.createElement('td');
                    const btnDel = document.createElement('button');
                    btnDel.className = 'btn-delete';
                    btnDel.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    `;
                    btnDel.addEventListener('click', () => deleteRecord(rec.id));
                    tdAction.appendChild(btnDel);

                    tr.appendChild(tdNum);
                    tr.appendChild(tdTime);
                    tr.appendChild(tdDef);
                    tr.appendChild(tdAction);
                    recordsBody.appendChild(tr);
                });
            }
        }

        function addRecord() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${hh}:${mm}:${ss}`;

            const newRecord = {
                id: recordCounter++,
                time: timeStr,
                defasagem: defasagemMs
            };

            records.push(newRecord);
            isSaved = false;
            renderTable();
        }

        function deleteRecord(id) {
            records = records.filter(rec => rec.id !== id);
            isSaved = false;
            renderTable();
        }

        // Registrar
        btnRegistrar.addEventListener('click', addRecord);

        // Salvar (CSV)
        btnSalvar.addEventListener('click', () => {
            if (records.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Numero,Hora,Defasagem (ms)\n";

            records.forEach(rec => {
                const defVal = hideRecordsActive ? '***' : rec.defasagem;
                csvContent += `${rec.id},${rec.time},${defVal}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `registros_som_da_terra_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            isSaved = true;
        });

        // Copiar para área de transferência
        btnCopiar.addEventListener('click', () => {
            if (records.length === 0) return;

            let textContent = "Nº\tHora\tDefasagem\n";
            records.forEach(rec => {
                const defVal = hideRecordsActive ? '***' : `${rec.defasagem} ms`;
                textContent += `${rec.id}\t${rec.time}\t${defVal}\n`;
            });

            navigator.clipboard.writeText(textContent).then(() => {
                alert('Tabela copiada para a área de transferência!');
                isSaved = true;
            }).catch(err => {
                console.error('Erro ao copiar dados: ', err);
            });
        });

        // Limpar registros com validação de dados não salvos
        btnLimpar.addEventListener('click', () => {
            if (records.length === 0) return;

            if (!isSaved) {
                const confirmClear = confirm("Você possui registros não salvos ou não copiados. Deseja realmente limpar toda a tabela?");
                if (!confirmClear) return;
            }

            records = [];
            recordCounter = 1;
            isSaved = true;
            renderTable();
        });

        // -------------------------
        // Play/Pause & Wake Lock
        // -------------------------

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`Wake Lock error: ${err.name}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        powerBtn.addEventListener('click', async () => {
            if (!isPlaying) {
                // Turn ON
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                    masterGainNode = audioCtx.createGain();
                    masterGainNode.gain.value = parseFloat(gainSlider.value) / 100;

                    limiter = audioCtx.createDynamicsCompressor();
                    limiter.threshold.setValueAtTime(-1.0, audioCtx.currentTime);
                    limiter.knee.setValueAtTime(0, audioCtx.currentTime);
                    limiter.ratio.setValueAtTime(20, audioCtx.currentTime);
                    limiter.attack.setValueAtTime(0, audioCtx.currentTime);
                    limiter.release.setValueAtTime(0.1, audioCtx.currentTime);

                    masterGainNode.connect(limiter);
                    limiter.connect(audioCtx.destination);
                }

                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                isPlaying = true;
                powerBtn.classList.add('active');
                powerText.textContent = "Ligado";

                // Estabelece a relação estável com o relógio de sistema apenas na inicialização
                epochOffset = (Date.now() / 1000.0) - audioCtx.currentTime;

                scheduledIndices.clear();
                scheduler();

                requestWakeLock();
            } else {
                // Turn OFF
                isPlaying = false;
                clearTimeout(timerID);
                powerBtn.classList.remove('active');
                powerText.textContent = "Desligado";

                releaseWakeLock();
            }
        });

        // -------------------------
        // Service Worker Registration
        // -------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((registration) => {
                    console.log('SW registration successful');
                }).catch((err) => {
                    console.log('SW registration failed: ', err);
                });
            });
        }

    </script>
</body>
